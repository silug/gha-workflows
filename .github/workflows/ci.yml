# Lint this repo's workflows (including the reusable ones) on every PR
---
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  actionlint:
    name: 'actionlint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # The one check for branch protection to require: GitHub only blocks a
  # merge on checks listed by name, and this job fails unless every job it
  # needs succeeded. Add any new job in this workflow to `needs:`.
  all-checks:
    name: 'All checks'
    if: always()
    needs:
      - actionlint
    runs-on: ubuntu-latest
    steps:
      - name: 'Fail unless every needed job succeeded'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
